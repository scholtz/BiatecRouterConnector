name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore BiatecRouterConnector.slnx --locked-mode

      # Build first: the router API client is code-generated into obj/ by an NSwag MSBuild target
      # that runs BeforeTargets="CoreCompile", so `dotnet format` can't resolve the project until a
      # build has produced it at least once.
      - name: Build (Release, warnings as errors)
        run: dotnet build BiatecRouterConnector.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Lint (dotnet format)
        run: dotnet format BiatecRouterConnector.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test BiatecRouterConnector.slnx --configuration Release --no-build -p:ContinuousIntegrationBuild=true --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  publish:
    name: Publish to NuGet
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for NuGet.org Trusted Publishing (OIDC)
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore BiatecRouterConnector.slnx --locked-mode

      # Package version is Major.Minor from the csproj plus the ever-increasing GitHub Actions
      # run number, so every push to master produces a strictly higher, unique version.
      - name: Compute package version
        id: version
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # GeneratePackageOnBuild=true removes "Build" from Pack's dependency chain (it assumes Pack
      # runs *as part of* Build, not the other way around), so `dotnet pack` alone on a clean
      # checkout fails with NU5026 ("dll to be packed was not found"). Build explicitly first.
      - name: Build
        run: |
          dotnet build BiatecRouterConnector/BiatecRouterConnector.csproj \
            --configuration Release \
            --no-restore \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: |
          dotnet pack BiatecRouterConnector/BiatecRouterConnector.csproj \
            --configuration Release \
            --no-restore \
            --no-build \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:ContinuousIntegrationBuild=true \
            -o ${{ github.workspace }}/artifacts

      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg" \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ${{ github.workspace }}/artifacts/*.nupkg
